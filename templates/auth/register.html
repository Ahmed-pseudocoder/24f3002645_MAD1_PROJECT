{% extends "base.html" %}

{% block title %}Register - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Register</h3>

        <form method="POST">
          <div class="mb-3">
            <label for="role" class="form-label">I want to register as</label>
            <select class="form-select" id="role" name="role" required>
              <option value="student">Student</option>
              <option value="company">Company</option>
            </select>
          </div>

          <hr>

          <!-- Student Fields -->
          <div id="student-fields">
            <h5>Student Information</h5>
            <div class="mb-3">
              <label for="full_name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="full_name" name="full_name" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" name="phone">
            </div>

            <div class="mb-3">
              <label for="department" class="form-label">Department</label>
              <input type="text" class="form-control" id="department" name="department" required>
            </div>

            <div class="mb-3">
              <label for="cgpa" class="form-label">CGPA</label>
              <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" value="0.0" required>
            </div>
          </div>

          <!-- Company Fields -->
          <div id="company-fields" style="display: none;">
            <h5>Company Information</h5>
            <div class="mb-3">
              <label for="company_name" class="form-label">Company Name</label>
              <input type="text" class="form-control" id="company_name" name="company_name" required>
            </div>

            <div class="mb-3">
              <label for="hr_contact" class="form-label">HR Contact Person</label>
              <input type="text" class="form-control" id="hr_contact" name="hr_contact" required>
            </div>

            <div class="mb-3">
              <label for="website" class="form-label">Website</label>
              <input type="url" class="form-control" id="website" name="website">
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Company Description</label>
              <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
          </div>

          <hr>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <div class="text-center mt-3">
          <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function updateFormValidation() {
  const role = document.getElementById('role').value;
  const studentFields = document.getElementById('student-fields');
  const companyFields = document.getElementById('company-fields');

  if (role === 'student') {
    studentFields.style.display = 'block';
    companyFields.style.display = 'none';
    // Disable hidden fields so browser required validation ignores them
    companyFields.querySelectorAll('input, textarea, select').forEach(el => el.disabled = true);
    studentFields.querySelectorAll('input, textarea, select').forEach(el => el.disabled = false);
  } else {
    studentFields.style.display = 'none';
    companyFields.style.display = 'block';
    // Disable hidden fields so browser required validation ignores them
    studentFields.querySelectorAll('input, textarea, select').forEach(el => el.disabled = true);
    companyFields.querySelectorAll('input, textarea, select').forEach(el => el.disabled = false);
  }
}

document.getElementById('role').addEventListener('change', updateFormValidation);
// Run once on load to disable default hidden fields
document.addEventListener("DOMContentLoaded", updateFormValidation);
</script>
{% endblock %}
