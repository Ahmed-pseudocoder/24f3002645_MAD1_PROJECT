{% extends "base.html" %}

{% block title %}Edit Drive - Placement Portal{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Edit Placement Drive</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="job_title" class="form-label">Job Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="job_title" name="job_title" value="{{ drive.job_title }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="job_description" class="form-label">Job Description</label>
                        <textarea class="form-control" id="job_description" name="job_description" rows="4">{{ drive.job_description or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="eligibility_criteria" class="form-label">Eligibility Criteria</label>
                        <textarea class="form-control" id="eligibility_criteria" name="eligibility_criteria" rows="3">{{ drive.eligibility_criteria or '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="application_deadline" class="form-label">Application Deadline <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="application_deadline" name="application_deadline" value="{{ drive.application_deadline }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="salary" class="form-label">Salary/CTC</label>
                            <input type="text" class="form-control" id="salary" name="salary" value="{{ drive.salary or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ drive.location or '' }}">
                    </div>

                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i>
                        After updating, the drive will be resubmitted for admin approval.
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('company.dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Drive</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
