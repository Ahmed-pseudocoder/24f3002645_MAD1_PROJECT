{% extends "base.html" %}

{% block title %}My Profile - Placement Portal{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">My Profile</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ student.full_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ student.phone or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label">Department <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="department" name="department" value="{{ student.department }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="cgpa" class="form-label">CGPA</label>
                        <input type="number" class="form-control" id="cgpa" name="cgpa" value="{{ student.cgpa }}" step="0.01" min="0" max="10">
                    </div>

                    <!-- Resume Upload Section -->
                    <hr>
                    <h5>Resume</h5>

                    {% if student.resume_path %}
                        <div class="alert alert-info d-flex align-items-center">
                            <i class="bi bi-file-earmark-pdf me-2"></i>
                            <div class="flex-grow-1">
                                <strong>Current Resume:</strong> {{ student.resume_path.split('/')[-1] }}
                                <a href="{{ url_for('static', filename=student.resume_path) }}" target="_blank" class="btn btn-sm btn-primary ms-2">View</a>
                            </div>
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="resume" class="form-label">Upload New Resume</label>
                        <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
                        <div class="form-text">Accepted formats: PDF, DOC, DOCX (Max 5MB)</div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
